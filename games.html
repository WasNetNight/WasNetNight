<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Games Page</title>
  <style>
    body {
      margin: 0;
      background-color: #1b1b1b;
      font-family: Arial, sans-serif;
      color: white;
      height: 100vh;
      position: relative;
    }

    .top-left-button {
      position: absolute;
      top: 20px;
      left: 20px;
      background-color: #444;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      text-decoration: none;
      font-size: 1rem;
      transition: background-color 0.3s;
    }

    .top-left-button:hover {
      background-color: #666;
    }
  </style>
</head>
<body>
  <a href="mc.html" class="top-left-button">Minecraft</a>

</html>
